# autoqueue 插件 — 无人值守任务队列
# 对齐 task-board 的双面插件 bundle 模式
- insert:
    - id: autoqueue
      name: '@alintever/dsh-plugin-autoqueue'
      config:
        maxGoalRounds: 40
        maxBlockedResumes: 3
        autoArchive: true
        unknownThreshold: 3
        maxAttempts: 3
        taskTimeoutMs: 10800000
        enableNotifications: false
        enableHostAiTools: true    # 加载后自动注入；部署可显式设为 false 关闭
        priority: 5
        scanIntervalMs: 15000
        maxConcurrent: 1
