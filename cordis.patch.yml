# autoqueue 插件 — 无人值守任务队列
# 对齐 task-board 的双面插件 bundle 模式
- insert:
    - id: autoqueue
      name: '@deepseek-ai/dsh-plugin-autoqueue'
      config:
        maxGoalRounds: 40
        maxBlockedResumes: 3
        autoArchive: false
        stallThreshold: 10
        unknownThreshold: 3
        maxAttempts: 3
        agentPreset: null
        priority: 5
        scanIntervalMs: 15000
        maxConcurrent: 2
